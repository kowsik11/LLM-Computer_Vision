[tool.poetry]
name = "llm-cv-planner"
version = "0.1.0"
description = "Planner service translating natural language goals into DSL programs."
authors = ["LLM_CV Team <automation@example.com>"]
packages = [{ include = "planner" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
openai = "^1.30.1"
anthropic = "^0.21.3"
pydantic = "^2.7.1"
structlog = "^24.1.0"
llm-cv-shared = { path = "../shared", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.1"

[build-system]
requires = ["poetry-core>=1.8.2"]
build-backend = "poetry.core.masonry.api"
