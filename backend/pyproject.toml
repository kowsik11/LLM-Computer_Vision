[tool.poetry]
name = "llm-cv-backend"
version = "0.1.0"
description = "FastAPI backend for the LLM + Computer Vision Browser Automation platform."
authors = ["LLM_CV Team <automation@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.110.2"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
sqlmodel = "^0.0.16"
asyncpg = "^0.29.0"
python-dotenv = "^1.0.1"
pydantic = "^2.7.1"
pydantic-settings = "^2.2.1"
structlog = "^24.1.0"
opentelemetry-sdk = "^1.24.0"
opentelemetry-instrumentation-fastapi = "^0.45b0"
redis = "^5.0.4"
boto3 = "^1.34.69"
llm-cv-shared = { path = "../shared", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.1"
pytest-asyncio = "^0.23.6"
httpx = "^0.27.0"
ruff = "^0.4.4"
black = "^24.4.2"

[build-system]
requires = ["poetry-core>=1.8.2"]
build-backend = "poetry.core.masonry.api"
